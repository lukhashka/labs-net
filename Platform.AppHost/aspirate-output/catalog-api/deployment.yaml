---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  labels:
    app: catalog-api
spec:
  minReadySeconds: 60
  replicas: 1
  selector:
    matchLabels:
      app: catalog-api
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: catalog-api
    spec:
      containers:
      - name: catalog-api
        image: catalog-api:v4
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        - name: https
          containerPort: 8443
        - name: grpc
          containerPort: 8081
        envFrom:
        - secretRef:
            name: platform-jwt
            optional: true
        - configMapRef:
            name: catalog-api-env
        - secretRef:
            name: catalog-api-secrets
      terminationGracePeriodSeconds: 180
