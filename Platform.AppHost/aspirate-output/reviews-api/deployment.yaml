---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reviews-api
  labels:
    app: reviews-api
spec:
  minReadySeconds: 60
  replicas: 1
  selector:
    matchLabels:
      app: reviews-api
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: reviews-api
    spec:
      containers:
      - name: reviews-api
        image: reviews-api:v1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        - name: https
          containerPort: 8443
        envFrom:
        - secretRef:
            name: platform-jwt
            optional: true
        - configMapRef:
            name: reviews-api-env
        - secretRef:
            name: reviews-api-secrets
      terminationGracePeriodSeconds: 180
