syntax = "proto3";

option csharp_namespace = "Catalog.Grpc";

package catalog;

import "google/protobuf/timestamp.proto";

// Read access to the catalog for internal services
service CatalogService {
  // Event card with details
  rpc GetEvent (GetEventRequest) returns (EventReply);
  // Cards of several events, unknown ids are skipped
  rpc GetEventsByIds (GetEventsByIdsRequest) returns (EventsReply);
  // Ticket types by their ids, unknown ids are skipped
  rpc GetTicketTypesByIds (GetTicketTypesByIdsRequest) returns (TicketTypesReply);
}

message GetEventRequest {
  int32 id = 1;
}

message GetEventsByIdsRequest {
  repeated int32 ids = 1;
}

message GetTicketTypesByIdsRequest {
  repeated int32 ids = 1;
}

message EventReply {
  int32 id = 1;
  string title = 2;
  google.protobuf.Timestamp starts_at = 3;
  google.protobuf.Timestamp ends_at = 4;
  string status = 5;
  string venue_name = 6;
  string description = 7;
  repeated string categories = 8;
}

message EventsReply {
  repeated EventReply events = 1;
}

message TicketTypeReply {
  int32 id = 1;
  int32 event_id = 2;
  string name = 3;
  string code = 4;
  double price = 5;            // in production money is a separate message with units/nanos
  int32 available_stock = 6;
}

message TicketTypesReply {
  repeated TicketTypeReply ticket_types = 1;
}
