syntax = "proto3";

option csharp_namespace = "Reviews.Grpc";

package reviews;

import "google/protobuf/timestamp.proto";

// Read access to ratings and reviews for internal services
service ReviewsService {
  // Average rating and number of reviews per event, one call for several events
  rpc GetRatingSummary (GetRatingSummaryRequest) returns (RatingSummaryReply);
  // Latest reviews of an event
  rpc GetLatestReviews (GetLatestReviewsRequest) returns (LatestReviewsReply);
}

message GetRatingSummaryRequest {
  repeated int64 event_ids = 1;
}

message EventRating {
  int64 event_id = 1;
  double average = 2;
  int64 count = 3;
}

message RatingSummaryReply {
  repeated EventRating ratings = 1;
}

message GetLatestReviewsRequest {
  int64 event_id = 1;
  int32 limit = 2;
}

message ReviewReply {
  string author_name = 1;
  int32 rating = 2;
  string text = 3;
  google.protobuf.Timestamp created_at = 4;
}

message LatestReviewsReply {
  repeated ReviewReply reviews = 1;
}
